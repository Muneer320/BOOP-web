name: Deploy BOOP Web

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  test-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: Backend/requirements.txt

      - name: Install dependencies
        run: pip install -r Backend/requirements.txt pytest httpx

      - name: Run tests
        working-directory: Backend
        run: pytest -q

  # The frontend is deployed by Vercel's Git integration, not by this workflow.
  deploy-backend:
    needs: test-backend
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure git and clone Space
        run: |
          git config --global user.email "action@github.com"
          git config --global user.name "GitHub Action"
          git clone https://${{ secrets.HF_USERNAME }}:${{ secrets.HF_TOKEN }}@huggingface.co/spaces/${{ secrets.HF_USERNAME }}/BOOP-backend ./hf-space

      - name: Sync Backend files into Space
        run: |
          rsync -a --delete --exclude=.git --exclude=venv --exclude=__pycache__ --exclude=.DS_Store --exclude=uploads --exclude=outputs --exclude=tests --exclude=.pytest_cache Backend/ ./hf-space/
          cp .github/HF_README.md ./hf-space/README.md
          cp .github/HF_gitattributes ./hf-space/.gitattributes

      - name: Commit and push to Hugging Face
        run: |
          cd ./hf-space
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to deploy"
            exit 0
          fi
          git commit -m "Update backend from GitHub - ${{ github.sha }}"
          git pull --rebase origin main
          git push origin main
